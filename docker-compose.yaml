services:
  ratelimiter:
    build:
      context: .
      target: dev
    container_name: ratelimiter
    working_dir: /app
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    ports:
      - "8080:8080"

volumes:
  go-mod-cache:
  go-build-cache:
